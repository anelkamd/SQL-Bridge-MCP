version: '3.8'

services:
  # SQL Bridge MCP Server
  sql-bridge-mcp:
    build: .
    image: sqlbridge/mcp-server:latest
    container_name: sql-bridge-mcp
    restart: unless-stopped
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-sqlbridge}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sql-bridge-network

  # MySQL Database (optional - for testing)
  mysql:
    image: mysql:8.0
    container_name: sql-bridge-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-testdb}
      - MYSQL_USER=${MYSQL_USER:-sqlbridge}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sql-bridge-network

networks:
  sql-bridge-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
